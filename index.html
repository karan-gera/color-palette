<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PalettePort</title>
    <meta name="description" content="The free, unlimited color palette generator for designers and developers. Generate, extract, preview, and export beautiful palettes. No sign-up, no limits." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://karan-gera.github.io/color-palette/" />
    <meta property="og:title" content="PalettePort — Color Palette Generator" />
    <meta property="og:description" content="The free, unlimited color palette generator. Generate, extract, preview, and export beautiful palettes. No sign-up, no limits." />
    <meta property="og:image" content="https://karan-gera.github.io/color-palette/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PalettePort — Color Palette Generator" />
    <meta name="twitter:description" content="The free, unlimited color palette generator. Generate, extract, preview, and export beautiful palettes." />
    <meta name="twitter:image" content="https://karan-gera.github.io/color-palette/og-image.png" />
    <script>
      // Prevent flash of wrong theme/CVD - runs before body renders
      (function() {
        // First-visit redirect — send new users to the landing page
        // TODO: restore !isLocal guard before domain switch (see TODO.md § Custom Domain)
        // Share links (?colors=...) bypass the redirect and don't mark the user as visited,
        // so their next direct visit still shows the landing page.
        var visited = localStorage.getItem('paletteport:visited');
        var isShareLink = location.search.indexOf('colors=') !== -1;
        var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        // TODO: remove !isLocal before domain switch (see TODO.md § Custom Domain)
        // In dev, Vite serves the React app for all routes — landing/ only works on GitHub Pages.
        // Test the landing page directly at: /color-palette/landing/index.html
        if (!visited && !isShareLink && !isLocal) {
          location.replace('landing/');
        }

        // Theme
        var theme = localStorage.getItem('color-palette:theme');
        if (!theme) {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
            theme = 'light';
          } else {
            theme = 'gray';
          }
        }
        document.documentElement.setAttribute('data-theme', theme);
        // Set initial background to prevent white flash
        var bg = theme === 'dark' ? '#1f1f1f' : theme === 'gray' ? '#8a8a8a' : '#fafafa';
        document.documentElement.style.backgroundColor = bg;
        
        // CVD (Color Vision Deficiency) simulation
        // Note: We only set the data attribute here for state tracking.
        // The actual filter is applied by React to the wrapper element
        // to ensure consistent rendering across all browsers.
        var cvd = localStorage.getItem('color-palette:cvd');
        if (cvd && cvd !== 'normal') {
          document.documentElement.setAttribute('data-cvd', cvd);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
